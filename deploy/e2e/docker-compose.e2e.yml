# Stack de E2E do ArchGuard (pacote 008, T-020 Fase A — smoke L1 do console PAM).
# Postgres + a imagem do fork em PERFIL DEV (keystore local, SEM OpenBao — dev usa o
# SecretStore provisional local). O backend serve o console + /api/v1 em :8000; o boot
# roda migrations e semeia admin/123 (built-in) num DB limpo.
#
# ⚠️ HARNESS NÃO VALIDADO na máquina de autoria (sem Docker). Rode `make e2e-up` e ajuste
#    se algo divergir (imagem, healthcheck, keystore). Depois `make e2e` e `make e2e-down`.
#
# KEYSTORE_UNSEAL_KEY: qualquer string (o keystore dev deriva a chave AES por SHA-256).
# A imagem :latest é a última publicada pelo CI; para testar código local, buste local.
name: archguard-e2e
services:
  e2e-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: casdoor
    tmpfs:
      - /var/lib/postgresql/data  # efêmero: cada run começa limpo (semeia admin/built-in)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d casdoor"]
      interval: 5s
      timeout: 3s
      retries: 12

  e2e-core:
    image: ghcr.io/edsonmartins/archguard:latest
    depends_on:
      e2e-postgres:
        condition: service_healthy
    # Perfil dev: sem cofre; entrypoint padrão (/server), SEM o wrapper wait-vault do piloto.
    entrypoint: ["/server"]
    environment:
      KEYSTORE_UNSEAL_KEY: "e2e-dev-only-not-a-secret-change-me"
    volumes:
      - ./app.conf:/conf/app.conf:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
