; app.conf de E2E (pacote 008, T-020 Fase A). Perfil DEV (keystore local, sem OpenBao),
; apontando para o Postgres do compose de E2E (host e2e-postgres). Igual ao conf/app.conf
; do repo, exceto a linha dataSourceName. NÃO usar em produção.
appname = archguard
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = postgres
dataSourceName = user=postgres password=postgres host=e2e-postgres port=5432 sslmode=disable
dbName = casdoor
migrationDataSourceName =
deploymentProfile = dev
keystorePath = conf/keystore.sealed
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = "127.0.0.1:10808"
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
aiAssistantUrl = "https://ai.casbin.com"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"console"}
initDataNewOnly = false
initDataFile = "./init_data.json"
frontendBaseDir = "../cc_0"
