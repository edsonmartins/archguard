name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright against Kanidm
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: archguard-console/.nvmrc
          cache: npm
          cache-dependency-path: archguard-console/package-lock.json

      - name: Install expect (for setup-kanidm.sh)
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install console deps
        working-directory: archguard-console
        run: npm ci

      - name: Install Playwright browsers
        working-directory: archguard-console
        run: npx playwright install --with-deps chromium

      # Kanidm refuses to start without a TLS chain/key, so the previous bare
      # `docker run` never came up and this job could not go green (audit
      # 2026-07-28). Generate a self-signed pair first. The tag is pinned to
      # match the staging stack instead of tracking `latest`.
      - name: Start Kanidm
        env:
          KANIDM_IMAGE: docker.io/kanidm/server:1.10.0
        run: |
          set -euo pipefail
          docker volume create kanidm-data >/dev/null

          # printf, not a heredoc: the terminator would need column-0 placement
          # that YAML block indentation cannot provide.
          docker run --rm -v kanidm-data:/data alpine sh -c 'printf "%s\n" \
            "bindaddress = \"0.0.0.0:8443\"" \
            "db_path = \"/data/kanidm.db\"" \
            "tls_chain = \"/data/chain.pem\"" \
            "tls_key = \"/data/key.pem\"" \
            "domain = \"localhost\"" \
            "origin = \"https://localhost:8443\"" > /data/server.toml'

          docker run --rm -v kanidm-data:/data "$KANIDM_IMAGE" \
            kanidmd cert-generate -c /data/server.toml

          docker run -d --name kanidmd -p 8443:8443 -v kanidm-data:/data \
            "$KANIDM_IMAGE" kanidmd server -c /data/server.toml

          for i in $(seq 1 60); do
            if curl -ks https://localhost:8443/status >/dev/null; then
              echo "Kanidm is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Kanidm failed to start"
          docker logs kanidmd
          exit 1

      - name: Provision Kanidm (test users + OAuth2 + SA token)
        run: ./scripts/setup-kanidm.sh

      - name: Run Playwright tests
        working-directory: archguard-console
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          # test-login is disabled unless explicitly enabled, and carries no
          # hardcoded password since the 2026-07-28 audit (P0-2).
          ARCHGUARD_E2E_LOGIN: "1"
          ARCHGUARD_TESTADMIN_PASSWORD: ArchGuard2026TestAdmin
          ARCHGUARD_TESTUSER_PASSWORD: ArchGuard2026TestUser
          ARCHGUARD_E2E_DISABLE_RATE_LIMIT: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: archguard-console/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: archguard-console/test-results
          retention-days: 14
          if-no-files-found: ignore
