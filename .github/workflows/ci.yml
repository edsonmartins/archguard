# CI do ArchGuard (fork do Casdoor). Substitui o build.yml herdado (Casdoor-específico:
# trigger em master, serviço MySQL, e2e cypress, semantic-release/goreleaser/helm gated em
# casdoor/casdoor). Ver docs/upstream/DIVERGENCE.md.
#
# Objetivo (decisão do usuário 2026-07-26): buildar no GitHub, não na VPS compartilhada.
#   - job `gate`  : porção CI-segura do gate do CLAUDE.md §5 (sem DB — INV-1..8 são estáticos;
#                   integração faz t.Skip sem ARCHGUARD_TEST_DSN; testes MySQL do Casdoor saem
#                   por -tags skipCi). O `make test` completo (com Postgres migrado + roles
#                   segregados) permanece o gate LOCAL do dev.
#   - job `image` : builda a imagem Docker (Dockerfile target STANDARD = frontend yarn + backend
#                   go) e publica no GHCR. A VPS só faz `docker compose pull && up -d`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.8"

jobs:
  gate:
    name: Gate (lint, testes, invariantes, sbom, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.mod
            tools/go.mod
      - name: Aquece o cache do go vet (JSON determinístico p/ o lintbaseline)
        # A 1ª execução de `go vet ./...` em cache frio intercala saída de build (não-JSON)
        # com o `-json`, truncando o parse do lintbaseline → achados herdados somem e a trava b
        # (obsoleto) dá falso-positivo. Aquecer aqui garante `go vet -json ./...` limpo no lint.
        run: go vet ./... 2>/dev/null || true
      - name: Lint (gofmt + lintbaseline)
        run: make lint
      - name: Testes ArchGuard (sem DB — integração faz Skip sem ARCHGUARD_TEST_DSN)
        # Escopo: código do fork (internal/, contract, cmd). Os testes legados do Casdoor
        # em ./object/... exigem DB (o CI do upstream provia MySQL); isso é coberto pelo
        # `make test` LOCAL com Postgres migrado. test/invariants roda no passo dedicado abaixo.
        run: go test -tags skipCi ./internal/... ./test/contract/... ./cmd/...
      - name: Invariantes INV-1..8
        run: make invariants
      - name: Regra de dependência (INV-3)
        run: make deps-check
      - name: SBOM + license gate (INV-4)
        run: make sbom
      - name: Build
        run: make build

  image:
    name: Imagem Docker → GHCR
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o smoke test do Dockerfile (util.GetVersionInfo via go-git)
          # resolve commit/tag e falha com "object not found" em checkout raso (depth 1).
          fetch-depth: 0
      - name: Nome da imagem (GHCR exige minúsculas)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/archguard" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (push só fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E smoke (console PAM)
    runs-on: ubuntu-latest
    needs: [image]
    # A imagem por SHA só é publicada fora de PR (o image job só faz push então).
    if: github.event_name != 'pull_request'
    # TEMPORÁRIO: não bloqueia o CI enquanto o harness de E2E (T-020 Fase A) estabiliza.
    # Remover quando estiver verde de forma consistente.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (GHCR exige minúsculas)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/archguard" >> "$GITHUB_OUTPUT"
      - name: Sobe a stack de E2E (imagem por SHA deste commit)
        env:
          ARCHGUARD_IMAGE: ${{ steps.img.outputs.name }}:${{ github.sha }}
        run: docker compose -f deploy/e2e/docker-compose.e2e.yml up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Instala deps do console (Cypress)
        run: yarn install --frozen-lockfile
        working-directory: web
      - name: E2E smoke (Cypress)
        env:
          ARCHGUARD_E2E_URL: http://localhost:8000
        run: yarn run e2e:archguard
        working-directory: web
      - name: Logs da stack (em falha)
        if: failure()
        run: docker compose -f deploy/e2e/docker-compose.e2e.yml logs --no-color --tail 200
      - name: Derruba a stack
        if: always()
        run: docker compose -f deploy/e2e/docker-compose.e2e.yml down -v
