appname = archguard
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = postgres
dataSourceName = user=postgres password=postgres host=localhost port=5432 sslmode=disable
dbName = casdoor
; Role segregation (ADR-0009, deploy/postgres/roles.sql): em produção, a aplicação
; conecta como archguard_app (sem UPDATE/DELETE na auditoria) via dataSourceName, e
; as migrations rodam como archguard_migrate via migrationDataSourceName. Vazio em
; dev = migrations usam o mesmo DSN da aplicação.
migrationDataSourceName =
; Perfil de implantação (ADR-0017): dev, pilot ou production. OBRIGATÓRIO — subir
; sem perfil válido é erro fatal. Perfil dev usa keystore local selado.
deploymentProfile = dev
; Perfil dev: caminho do keystore selado (chave de assinatura fora do banco).
; Material de selagem (unseal) via variável de ambiente KEYSTORE_UNSEAL_KEY.
keystorePath = conf/keystore.sealed
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = "127.0.0.1:10808"
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
aiAssistantUrl = "https://ai.casbin.com"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
initDataNewOnly = false
initDataFile = "./init_data.json"
frontendBaseDir = "../cc_0"